[project]
name = "neutral-llm-gateway"
version = "0.4.0"
description = "Neutral LLM gateway: typed contracts, provider adapters and explicit retry, fallback, usage and cost accounting."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
openai = ["openai>=2.41,<3"]
gemini = ["google-genai>=2.11,<3"]
groq = ["groq>=1.4,<2"]
all = [
    "openai>=2.41,<3",
    "google-genai>=2.11,<3",
    "groq>=1.4,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Provider SDKs are optional extras. Type checking must pass with none of them
# installed, which is exactly the environment CI runs in.
module = ["google.*", "google.genai.*", "groq.*", "openai.*"]
ignore_missing_imports = true
