# Dependency maintenance: reviewed pull requests, no automatic merge.
# Policy: https://github.com/jmgb/autofix-control-plane/blob/main/docs/DEPENDENCY_MAINTENANCE.md
# Security updates are enabled separately and do not wait for this schedule.
version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    time: 05:00
    timezone: Europe/Madrid
    day: monday
  cooldown:
    default-days: 7
  open-pull-requests-limit: 2
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-minor
    - version-update:semver-patch
  groups:
    minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(deps)
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
    time: 05:00
    timezone: Europe/Madrid
  cooldown:
    default-days: 7
  open-pull-requests-limit: 2
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-minor
    - version-update:semver-patch
  groups:
    minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(deps)
